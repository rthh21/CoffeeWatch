<section class="w-full bg-black px-6 md:px-16 py-24">
  <div class="max-w-[1400px] mx-auto">
    <h2 class="text-4xl md:text-5xl font-bold tracking-tight mb-12 text-white">Overview.</h2>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
      @for (watch of popularWatches; track watch.id) {
        <div class="bg-[#1d1d1f] rounded-[32px] overflow-hidden flex flex-col group cursor-pointer hover:bg-[#252528] transition-colors duration-300" (click)="navigate.emit('catalog')">
          <div class="w-full h-[280px] bg-white p-6 relative overflow-hidden">
            <span class="absolute top-4 left-4 z-10 text-[10px] uppercase font-semibold px-3 py-1 bg-white/10 text-white rounded-full backdrop-blur-md">
              {{ watch.type }}
            </span>
            <img [src]="watch.image" [alt]="watch.name" loading="lazy" class="w-full h-full object-contain group-hover:scale-110 transition-transform duration-500 ease-out will-change-transform">
          </div>
          
          <div class="p-8 flex flex-col flex-grow justify-between">
            <div>
              <p class="text-xs font-semibold text-gray-400 mb-1 uppercase tracking-wider">{{ watch.brand }}</p>
              <h3 class="text-xl font-bold text-white mb-2">{{ watch.name }}</h3>
            </div>
            <div class="mt-4 flex justify-between items-center">
              <p class="text-[15px] font-medium text-[#a1a1a6]">{{ watch.price | number:'1.0-0' }} RON</p>
              <button class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center group-hover:bg-white group-hover:text-black transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
              </button>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
