<div class="min-h-[calc(100vh-56px)] bg-black text-white p-8 flex flex-col items-center">
  <div class="max-w-2xl w-full">
    <div class="flex justify-between items-center mb-10 pb-6 border-b border-white/10">
      <div>
        <h2 class="text-4xl font-bold tracking-tight mb-2">Administration</h2>
        <p class="text-[#a1a1a6] text-sm">Add a new luxury timepiece to the collection</p>
      </div>
      <button (click)="navigate.emit('home')" class="bg-white/5 text-white px-6 py-2.5 rounded-full text-sm font-medium hover:bg-white/10 transition-colors border border-white/10">
        Back Home
      </button>
    </div>

    <form (submit)="submitForm(); $event.preventDefault()" class="bg-[#1d1d1f] rounded-[32px] p-10 border border-white/5 shadow-2xl">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        
        
        <div class="flex flex-col gap-2">
          <label class="text-[11px] font-semibold text-[#a1a1a6] uppercase tracking-wider ml-1">Brand Name</label>
          <input type="text" [(ngModel)]="newWatch().brand" name="brand" placeholder="e.g. Rolex" 
                 class="bg-black border border-white/10 rounded-2xl px-5 py-3.5 text-sm focus:outline-none focus:border-[#0071e3] transition-colors text-white placeholder-[#424245]">
        </div>

        
        <div class="flex flex-col gap-2">
          <label class="text-[11px] font-semibold text-[#a1a1a6] uppercase tracking-wider ml-1">Model Name</label>
          <input type="text" [(ngModel)]="newWatch().name" name="name" placeholder="e.g. Submariner" 
                 class="bg-black border border-white/10 rounded-2xl px-5 py-3.5 text-sm focus:outline-none focus:border-[#0071e3] transition-colors text-white placeholder-[#424245]">
        </div>

        
        <div class="flex flex-col gap-2">
          <label class="text-[11px] font-semibold text-[#a1a1a6] uppercase tracking-wider ml-1">Price (RON)</label>
          <input type="number" [(ngModel)]="newWatch().price" name="price" 
                 class="bg-black border border-white/10 rounded-2xl px-5 py-3.5 text-sm focus:outline-none focus:border-[#0071e3] transition-colors text-white">
        </div>

        
        <div class="flex flex-col gap-2">
          <label class="text-[11px] font-semibold text-[#a1a1a6] uppercase tracking-wider ml-1">Initial Stock</label>
          <input type="number" [(ngModel)]="newWatch().stock" name="stock" 
                 class="bg-black border border-white/10 rounded-2xl px-5 py-3.5 text-sm focus:outline-none focus:border-[#0071e3] transition-colors text-white">
        </div>

        
        <div class="flex flex-col gap-2 md:col-span-2">
          <label class="text-[11px] font-semibold text-[#a1a1a6] uppercase tracking-wider ml-1">Watch Category</label>
          <select [(ngModel)]="newWatch().type" name="type" 
                  class="bg-black border border-white/10 rounded-2xl px-5 py-3.5 text-sm focus:outline-none focus:border-[#0071e3] transition-colors text-white appearance-none cursor-pointer">
            <option value="Mechanical">Mechanical Timepiece</option>
            <option value="Smartwatch">Smartwatch / Digital</option>
          </select>
        </div>

      </div>

      <div class="mt-12 flex items-center justify-end gap-4 border-t border-white/5 pt-8">
        <button type="button" (click)="navigate.emit('catalog')" class="px-8 py-3.5 text-sm font-semibold text-[#a1a1a6] hover:text-white transition-colors">
          Cancel
        </button>
        <button type="submit" 
                [disabled]="!newWatch().name || !newWatch().brand || newWatch().price <= 0"
                class="bg-[#0071e3] disabled:opacity-50 disabled:cursor-not-allowed text-white px-10 py-3.5 rounded-full text-sm font-bold hover:bg-[#0077ed] transition-all transform active:scale-95 shadow-lg shadow-[#0071e3]/20">
          Save Product
        </button>
      </div>
    </form>

    
    <div class="mt-8 p-6 bg-blue-500/5 border border-blue-500/10 rounded-3xl flex gap-4 items-start">
      <svg class="w-6 h-6 text-[#0071e3] shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <div>
        <p class="text-sm text-[#a1a1a6] leading-relaxed">
          Adding a product will automatically trigger a background synchronization with the database. Ensure all details are correct before saving.
        </p>
      </div>
    </div>
  </div>
</div>
